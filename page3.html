<main class="container mt-4 mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="text-center mb-4">
        <h1 class="fw-normal">Enroll Now</h1>
      </div>

      <div class="card bg-light shadow p-4 p-md-5 enroll-card">
        <form>
          <h2 class="h4 mb-3">Student Information</h2>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="firstname" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstname" placeholder="First name" required>
            </div>
            <div class="col-md-6">
              <label for="lastname" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastname" placeholder="Last name" required>
            </div>
            <div class="col-md-6">
              <label for="birthdate" class="form-label">Date of Birth</label>
              <input type="date" class="form-control" id="birthdate" required>
            </div>
            <div class="col-md-6">
              <label for="gender" class="form-label">Gender</label>
              <select class="form-select" id="gender" required>
                <option value="" selected disabled>Select Gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="RatherNotSay">Rather not say</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="levelApplying" class="form-label">Grade Level</label>
              <select class="form-select" id="levelApplying" required>
                <option value="" selected disabled>Choose grade level</option>
                <option value="Casa">Casa</option>
                <option value="Grade 1">Grade 1</option>
                <option value="Grade 2">Grade 2</option>
                <option value="Grade 3">Grade 3</option>
                <option value="Grade 4">Grade 4</option>
                <option value="Grade 5">Grade 5</option>
                <option value="Grade 6">Grade 6</option>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grade 9">Grade 9</option>
                <option value="Grade 10">Grade 10</option>
                <option value="Grade 11">Grade 11</option>
                <option value="Grade 12">Grade 12</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="campus" class="form-label">Campus</label>
              <select class="form-select" id="campus" required>
                <option value="" selected disabled>Choose an OBMC campus</option>
                <option value="Angeles">Angeles</option>
                <option value="Fairview">Fairview</option>
                <option value="Greenhills">Greenhills</option>
                <option value="Las Pinas">Las Pinas</option>
                <option value="Sta. Ana">Sta. Ana</option>
              </select>
            </div>
            <div class="col-12">
              <label for="previousschool" class="form-label">Previous School (if applicable)</label>
              <input type="text" class="form-control" id="previousschool" placeholder="Enter previous school name">
            </div>
          </div>

          <hr class="my-4">

          <h2 class="h4 mb-3">Contact Details</h2>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="guardianname" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="guardianname" placeholder="Full name" required>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="col-md-12">
              <label for="phonenumber" class="form-label">Contact Number</label>
              <input type="tel" class="form-control" id="phonenumber" placeholder="09XX XXX XXXX" required>
            </div>
            </div>
            <div class="col-12">
              <label for="notes" class="form-label">Additional Notes</label>
              <textarea class="form-control" id="notes" rows="3"></textarea>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="confirmInfo" required>
                <label class="form-check-label" for="confirmInfo">I confirm that the information provided is accurate.</label>
              </div>
            </div>
          </div>

          <div class="mt-4 d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-obmc px-4">Submit Enrollment</button>
          </div>
        </form>
      </div>
    </div>
  </div>
